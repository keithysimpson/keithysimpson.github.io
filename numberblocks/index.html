<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Numbers · Block playground</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f4ee url("background.webp") center / cover fixed no-repeat;min-height:100vh;color:#253b37;font-family:ui-rounded,'Trebuchet MS',sans-serif}main{max-width:1050px;margin:auto;padding:24px;background:#f6f4ee33;min-height:100vh}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 16px}button{font:inherit;font-weight:bold;border:1px solid #d5dcd3;border-radius:13px;background:white;color:#253b37;padding:12px 16px;cursor:pointer;min-height:46px}button:hover{background:#eaf0e6}button:focus-visible{outline:3px solid #275cbd;outline-offset:3px}button.active{background:#244f45;color:white;border-color:#244f45}button:disabled{opacity:.4;cursor:default}.spacer{flex:1}.board-wrap{background:#e7ece133;border:1px solid #d9e0d3;padding:14px;border-radius:24px;box-shadow:0 12px 35px #203b3710}svg{display:block;width:100%;max-height:65vh;aspect-ratio:1/1;touch-action:none;user-select:none;border-radius:12px;background:#fcfdf84d}.block{cursor:grab}.block:active{cursor:grabbing}.cell{stroke-width:2}.eye{fill:#253b37}.label{font-weight:900;font-size:24px;fill:#253b37;paint-order:stroke;stroke:#ffffffb0;stroke-width:3px}.equation{min-height:64px;margin:16px 0 0;text-align:center;font-size:clamp(24px,5vw,36px);font-weight:900;white-space:pre-line}@media(max-width:600px){main{padding:18px 12px}.toolbar{margin-top:16px;gap:6px}button{padding:10px 12px;font-size:14px}.board-wrap{padding:7px;border-radius:17px}.spacer{display:none}svg{max-height:none}}

.playground{display:flex;flex-direction:column;gap:16px}.board-wrap{width:100%;min-width:0}.tools{display:grid;grid-template-columns:76px 88px;grid-template-rows:auto auto;align-items:center;justify-items:center;justify-content:center;column-gap:8px;row-gap:2px}.tools #add{grid-column:1;grid-row:1}.tools #trash{grid-column:2;grid-row:1}.tools .hint{grid-row:2}.hint{font-size:12px;text-align:center}#add{padding:0;border:0;background:transparent;width:54px;height:54px;cursor:grab;touch-action:none}#add:active{cursor:grabbing}#add svg,#trash svg,#one-preview svg{width:100%;height:100%;max-height:none;background:transparent}#trash{width:54px;height:54px;padding:6px;border:2px dashed #6b7c70;border-radius:16px;background:#ffffffb8;text-align:center;transition:background .15s,transform .15s}#trash svg{height:100%}#trash.over{background:#ffd7d1;border-color:#bd3731;transform:scale(1.08)}#one-preview{position:fixed;width:60px;height:60px;transform:translate(-50%,-50%);pointer-events:none;z-index:10;opacity:.85}@media(max-width:600px){.playground{gap:12px}.tools{column-gap:4px;grid-template-columns:66px 80px}.hint{font-size:11px}}
#board.cut-mode,#board.cut-mode .block{cursor:crosshair}
</style>
</head>
<body><main>
<div class="toolbar"><button id="move" class="active" aria-pressed="true">↗ Move</button><button id="split" aria-pressed="false">✂ Split</button><button id="cut" aria-pressed="false" title="Draw a line along grid edges to split a block">✎ Cut</button><aside class="tools" aria-label="Block tools">
<button id="add" aria-label="Add a one" title="Click to add a one, or drag onto the grid"><svg viewBox="0 0 60 60" aria-hidden="true"><rect x="3" y="3" width="54" height="54" rx="10" fill="#e53935" stroke="white" stroke-width="3"/><path d="M12 10 H45" stroke="#ffffff65" stroke-width="3" stroke-linecap="round"/><text class="label" text-anchor="middle" x="30" y="31">1</text><circle class="eye" cx="23" cy="41" r="2.5"/><circle class="eye" cx="37" cy="41" r="2.5"/><path d="M26 47 Q30 51 34 47" stroke="#253b37" stroke-width="2" fill="none"/></svg></button>
<span class="hint">Click or drag</span>
<div id="trash" title="Drag a block here to remove it" aria-label="Trash: drag a block here to remove it"><svg viewBox="0 0 60 60" aria-hidden="true"><path d="M15 18 H45 L42 52 H18 Z M11 18 H49 M23 18 V10 H37 V18 M25 26 V43 M35 26 V43" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><span></span></div>
<span class="hint">Drop to remove</span></aside><span class="spacer"></span><button id="undo" disabled>↶ Undo</button><button id="clear">Clear</button></div>
<div class="playground"><div class="board-wrap"><svg id="board" viewBox="0 0 600 600" role="img" aria-label="Number playground: 10 columns and 10 rows. Select a block with a tap, then use arrow keys to move it."></svg></div></div>
<div id="one-preview" hidden aria-hidden="true"></div>
<div id="message" class="equation" role="status" aria-live="polite" aria-atomic="true"></div>
</main><script src="engine.js"></script><script src="colours.js"></script><script src="app.js"></script></body></html>
