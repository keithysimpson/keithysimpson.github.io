<!--
APP BRIEF:
A minimal, mobile-first web app to display the history of various events (e.g. start of life on Earth, dinosaurs, modern humans, printing press, etc.). To be hosted on GitHub Pages as a single HTML file.

Inspired and based heavily on "https://waitbutwhy.com/2013/08/putting-time-in-perspective.html"

Layout
- A fixed vertical timeline rail runs down the left side of the screen
- "Today" is anchored at the bottom of the rail
- The top of the rail always represents the start of the current zoom level (e.g. Big Bang for level 1, Earth formation for level 2, etc.)
- The rail fills the visible screen height
- Event cards are listed to the right of the rail and are independently scrollable

Navigation / Zoom

- A slider at the top controls the zoom level
- Notch labels below the slider show the time span at each stop

Timeline Rail

- Each event is represented by a coloured dot on the rail, positioned proportionally to its true position in time within the current zoom window
- When changing zoom level, dots animate smoothly to their new scaled positions via CSS transitions (top property, 500ms, ease-in-out cubic bezier)
- Dots leaving the visible range slide to the top of the rail before fading out; dots entering slide in from the top

Event Cards

- Each card shows: time label, event name, short description
- Cards are stacked vertically and nudged apart to avoid overlap
- Cards animate position in sync with their corresponding rail dot


-->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline</title>
  <link rel="stylesheet" href="nano.min.css">

  <!-- load the main stylesheet -->
  <link rel="stylesheet" href="main.css">

</head>

<body>
  <div id="app">
    <div class="header">
      <div class="header-top">
        <span class="level-name" id="level-name">Universe · 13.8 billion years</span>
      </div>
      <div class="slider-row">
        <button class="nav-btn" id="nav-back">&lt; Back</button>
        <div class="zoom-dots-track">
          <div class="zoom-dots-line"></div>
          <div class="zoom-dots-container" id="zoom-dots"></div>
        </div>
        <button class="nav-btn" id="nav-forward">Forward &gt;</button>
      </div>
    </div>
    <div class="body" id="body">
      <div class="rail-col" id="rail-col">
        <div class="level-bg-layer" id="level-bg-layer"></div>
        <div class="rail-line"></div>
        <div class="now-dot"></div>
        <div class="today-lbl">Today</div>
      </div>
      <div class="events-col" id="events-col">
        <div class="events-inner" id="events-inner"></div>
      </div>
      <svg id="connectors-svg"></svg>
    </div>
  </div>

  <!-- Settings cog button -->
  <button class="settings-btn" id="settings-btn" title="Settings">
    <svg viewBox="0 0 24 24">
      <path
        d="M19.14 12.94a7.07 7.07 0 0 0 .06-.94c0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.04 7.04 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.37 1.03.7 1.62.94l.36 2.54c.05.24.26.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z" />
    </svg>
  </button>

  <!-- Settings panel (slides up from bottom) -->
  <div class="settings-overlay" id="settings-overlay"></div>
  <div class="settings-panel" id="settings-panel">
    <div class="settings-header">
      <span class="settings-title">Event categories</span>
      <button class="settings-close" id="settings-close">&times;</button>
    </div>
    <div class="settings-body" id="settings-body"></div>
  </div>

  <!-- Custom Modal for Category/Event Form -->
  <div class="modal-overlay" id="custom-modal-overlay"></div>
  <div class="custom-modal" id="custom-modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">New Category</span>
      <button class="modal-close" id="modal-close-btn">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script src="firebase-app.js"></script>
  <script src="pickr.min.js"></script> <!-- Color picker library  -->


  <script src="events.js"></script> <!-- Default Event data categories that all users can see -->
  


  <!-- load the main app script -->
  <script src="timeline_app.js"></script>

</body>
